<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1efee"/>
      <stop offset="55%" stop-color="#fbf9f1"/>
      <stop offset="100%" stop-color="#fffdee"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbf9f1" stop-opacity=".97"/>
      <stop offset="58%" stop-color="#fbf9f1" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fbf9f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#wash)"/>
  
</svg>